<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trazado de Línea</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
    <link rel="stylesheet" href="css/modulo02.css" />
  </head>

  <body>
    <h2>Trazado de línea entre dedos índices</h2>

    <script>
      let video;
      let handPose;
      let hands = [];

      function preload() {
        handPose = ml5.handPose();
      }

      function setup() {
        createCanvas(640, 480);

        video = createCapture(VIDEO);
        video.size(640, 480);
        video.hide();

        handPose.detectStart(video, gotHands);
      }

      function gotHands(results) {
        hands = results;
      }

      function draw() {
        image(video, 0, 0, width, height);

        if (hands.length >= 2) {
          let dedo1 = hands[0].keypoints[8];
          let dedo2 = hands[1].keypoints[8];

          let distancia = dist(dedo1.x, dedo1.y, dedo2.x, dedo2.y);

          let grosor = map(distancia, 0, 300, 20, 2);
          grosor = constrain(grosor, 2, 20);

          if (distancia < 80) {
            stroke(255, 0, 0);
          } else {
            stroke(0, 255, 0);
          }

          strokeWeight(grosor);
          line(dedo1.x, dedo1.y, dedo2.x, dedo2.y);

          fill(0, 0, 255);
          noStroke();
          circle(dedo1.x, dedo1.y, 20);
          circle(dedo2.x, dedo2.y, 20);

          let mx = (dedo1.x + dedo2.x) / 2;
          let my = (dedo1.y + dedo2.y) / 2;

          fill(255);
          noStroke();
          textSize(18);
          textAlign(CENTER);
          text(int(distancia) + " px", mx, my - 10);
        }
      }
    </script>
  </body>
</html>
