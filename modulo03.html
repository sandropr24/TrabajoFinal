<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partes del Rostro</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
    <link rel="stylesheet" href="css/modulo02.css" />
  </head>
  <body>
    <h2>Detección de partes del rostro</h2>

    <div id="controles">
      <label>Parte del rostro:</label>
      <select id="selectParte">
        <option value="ojo_izq">Ojo izquierdo</option>
        <option value="ojo_der">Ojo derecho</option>
        <option value="nariz">Nariz</option>
        <option value="ceja_izq">Ceja izquierda</option>
        <option value="ceja_der">Ceja derecha</option>
        <option value="boca">Boca</option>
      </select>
      <label>Color:</label>
      <input type="color" id="colorPicker" value="#ff0000" />
    </div>

    <div id="canvas-container"></div>

    <script>
      let faceMesh;
      let video;
      let faces = [];

      const options = {
        maxFaces: 1,
        refineLandmarks: false,
        flipHorizontal: false,
      };

      const partes = {
        ojo_izq: (face) => face.leftEye,
        ojo_der: (face) => face.rightEye,
        nariz: (face) => ({keypoints: [1, 2, 98, 327, 168, 197, 195, 5, 4, 6].map((i) => face.keypoints[i],), }),
        ceja_izq: (face) => face.leftEyebrow,
        ceja_der: (face) => face.rightEyebrow,
        boca: (face) => face.lips,
      };

      function preload() {
        faceMesh = ml5.faceMesh(options);
      }

      function setup() {
        let canvas = createCanvas(640, 480);
        canvas.parent("canvas-container");

        video = createCapture(VIDEO);
        video.size(640, 480);
        video.hide();

        faceMesh.detectStart(video, gotFaces);
      }

      function gotFaces(results) {
        faces = results;
      }

      function draw() {
        image(video, 0, 0, width, height);

        if (faces.length > 0) {
          let face = faces[0];

          let parteSeleccionada = document.getElementById("selectParte").value;
          let colorHex = document.getElementById("colorPicker").value;

          let r = parseInt(colorHex.slice(1, 3), 16);
          let g = parseInt(colorHex.slice(3, 5), 16);
          let b = parseInt(colorHex.slice(5, 7), 16);

          let parte = partes[parteSeleccionada](face);

          fill(r, g, b);
          noStroke();

          for (let kp of parte.keypoints) {
            circle(kp.x, kp.y, 10);
          }
        }
      }
    </script>
  </body>
</html>
